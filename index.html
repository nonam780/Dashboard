<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard Nurul</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }
      .blink-status {
        animation: blink 1.5s infinite;
      }
    </style>
  </head>
  <body
    class="bg-gradient-to-br from-pink-50 via-rose-50 to-pink-100 text-gray-800 h-screen overflow-hidden flex flex-col"
  >
    <!-- URL WEB APP GOOGLE APPS SCRIPT KAMU -->
    <script>
      const WEB_APP_URL =
        "https://script.google.com/macros/s/AKfycbz0a8QRZ1PurkS9pW7BBNpMGRqchpscMCbKZ_uwCZQzMSkkClsOoU7BvvdcmoHRlxOhwA/exec";
    </script>

    <!-- FLYING POPUP ERROR TOAST -->
    <div
      id="flyingPopup"
      class="fixed top-5 left-1/2 -translate-x-1/2 z-50 hidden"
    >
      <div
        class="bg-red-600 text-white px-6 py-3 rounded-2xl shadow-2xl flex items-center gap-3 border-2 border-white"
      >
        <i class="fa-solid fa-triangle-exclamation text-xl"></i>
        <span id="flyingPopupMsg" class="font-extrabold text-sm tracking-wide"
          >Password Salah Pendek</span
        >
      </div>
    </div>

    <!-- LOGIN CONTAINER -->
    <div
      id="loginSection"
      class="fixed inset-0 z-40 flex items-center justify-center bg-pink-900/20 backdrop-blur-md"
    >
      <div
        class="bg-white/95 p-8 rounded-3xl shadow-2xl w-full max-w-sm border border-pink-200 text-center relative overflow-hidden"
      >
        <div
          class="w-16 h-16 bg-gradient-to-br from-pink-500 to-rose-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-lg shadow-pink-300"
        >
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h2 class="text-2xl font-black text-gray-800 mb-0.5 tracking-tight">
          DASHBOARD NURUL
        </h2>
        <p class="text-xs font-semibold text-gray-400 mb-6">Masukan Password</p>

        <div class="mb-5">
          <input
            type="password"
            id="pinInput"
            placeholder="••••"
            onkeydown="if (event.key === 'Enter') handleLogin();"
            class="w-full text-center text-2xl font-bold tracking-widest py-3 px-4 rounded-xl border border-pink-200 bg-white focus:outline-none focus:border-pink-500 text-gray-800"
          />
        </div>

        <button
          onclick="handleLogin()"
          class="w-full bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white font-bold py-3.5 rounded-2xl transition-all shadow-lg shadow-pink-300/50 hover:scale-[1.02]"
        >
          Masuk Dashboard
        </button>
      </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div
      id="appSection"
      class="hidden h-screen w-full flex flex-col md:flex-row overflow-hidden"
    >
      <!-- SIDEBAR -->
      <aside
        class="w-full md:w-64 bg-white/90 backdrop-blur-lg border-r border-pink-200 p-5 flex flex-col shadow-xl h-full overflow-y-auto shrink-0"
      >
        <div class="flex items-center gap-3 mb-6">
          <div
            class="w-10 h-10 bg-gradient-to-tr from-pink-500 to-rose-500 text-white rounded-2xl flex items-center justify-center text-lg font-black shadow-lg shadow-pink-300"
          >
            N
          </div>
          <div>
            <h1
              class="font-extrabold text-gray-800 text-base leading-none tracking-tight"
            >
              Dashboard Nurul
            </h1>
            <span
              class="text-[10px] text-pink-600 font-semibold uppercase tracking-wider"
              >Project & Rework</span
            >
          </div>
        </div>
        <nav class="space-y-2 flex-1">
          <button
            onclick="switchTab('project')"
            id="btnTabProject"
            class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl font-bold text-xs transition-all text-white bg-gradient-to-r from-pink-500 to-rose-500 shadow-md shadow-pink-200"
          >
            <i class="fa-solid fa-diagram-project text-sm"></i> List Project
          </button>
          <button
            onclick="switchTab('rework')"
            id="btnTabRework"
            class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl font-bold text-xs transition-all text-gray-500 hover:bg-pink-100/50 hover:text-pink-600"
          >
            <i class="fa-solid fa-file-pen text-sm"></i> List Rework
          </button>
        </nav>
        <button
          onclick="location.reload()"
          class="flex items-center gap-2 text-xs font-bold text-gray-400 hover:text-pink-600 mt-auto pt-3 border-t border-pink-100"
        >
          <i class="fa-solid fa-right-from-bracket"></i> Keluar Sistem
        </button>
      </aside>

      <!-- MAIN CONTENT AREA -->
      <main class="flex-1 p-4 md:p-6 h-full overflow-hidden flex flex-col">
        <div
          id="sectionProject"
          class="space-y-3.5 flex-1 flex flex-col min-h-0"
        >
          <div
            class="bg-white/90 backdrop-blur-md rounded-2xl border border-pink-200 shadow-xl overflow-hidden flex-1 flex flex-col min-h-0"
          >
            <div class="overflow-x-auto overflow-y-auto flex-1 h-full p-4">
              <h2 class="text-base font-black text-pink-600 mb-4">
                Memuat Data Project...
              </h2>
              <div id="projectTableBody"></div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script>
      function showFlyingPopup(msg) {
        const el = document.getElementById("flyingPopup");
        document.getElementById("flyingPopupMsg").innerText = msg;
        el.classList.remove("hidden");
        setTimeout(() => {
          el.classList.add("hidden");
        }, 3000);
      }

      function handleLogin() {
        const pin = document.getElementById("pinInput").value;
        if (!pin) {
          showFlyingPopup("Password Masih Kosong");
          return;
        }

        fetch(
          `${WEB_APP_URL}?action=verifyPassword&pin=${encodeURIComponent(pin)}`,
        )
          .then((res) => res.json())
          .then((res) => {
            if (res.success) {
              document.getElementById("loginSection").classList.add("hidden");
              document.getElementById("appSection").classList.remove("hidden");
              loadDataFromSpreadsheet();
            } else {
              showFlyingPopup("Password Salah Pendek");
            }
          })
          .catch((err) => {
            showFlyingPopup("Gagal terhubung ke server database!");
          });
      }

      function loadDataFromSpreadsheet() {
        fetch(`${WEB_APP_URL}?action=getProjectData`)
          .then((res) => res.json())
          .then((data) => {
            console.log("Data Project:", data);
            // Di sini data project siap dirender ke tabel kamu
          });
      }

      function switchTab(tab) {
        // Logika switch tab aktif
      }
    </script>
  </body>
</html>
